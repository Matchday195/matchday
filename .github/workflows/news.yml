name: Update transfer news

on:
  schedule:
    - cron: "7,37 * * * *"   # about every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_news.py", ".github/workflows/news.yml"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/fetch_news.py news.json
      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "Update transfer news"
            git pull --rebase origin main
            git push
          else
            echo "No new headlines"
          fi
