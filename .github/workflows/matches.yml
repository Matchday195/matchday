name: Update matches

# Fetches real fixtures, scores and tables from football-data.org and saves them on the
# separate "data" branch, so score updates never rebuild the website itself.
# GitHub starts scheduled jobs late (often 30-45 minutes apart), so a run does not stop
# after a few minutes: while any match is live or about to start it keeps fetching once
# a minute (up to ~5h45m, GitHub's job limit is 6h). With nothing on, it checks once and stops.
# Uses 1 API call per minute (the free limit is 10).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_matches.py", "scripts/keep_going.py", ".github/workflows/matches.yml"]

permissions:
  contents: write

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  matches:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get previous data
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then
            for f in matches.json standings.json season.json; do git show "origin/data:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"; done
          fi
      - name: Fetch every minute while matches are on
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          publish() {
            rm -rf pub && mkdir pub && cp out/*.json pub/ && cd pub
            git init -q -b data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "Update matches"
            git push -q --force "$REPO_URL" data || echo "push failed, will retry next minute"
            cd ..
          }
          began=$(date +%s)
          last_full=0
          i=0
          while :; do
            i=$((i + 1))
            start=$(date +%s)
            # Full fetch (2 weeks back/ahead + tables + whole season every 6h) on the first pass and every 30 minutes; quick 1-call fetch otherwise.
            if [ $((start - last_full)) -ge 1800 ]; then
              python scripts/fetch_matches.py out; last_full=$start
            else
              python scripts/fetch_matches.py out --quick
            fi
            publish
            if grep -q 'FOOTBALL_DATA_TOKEN secret is not set' out/status.json; then break; fi
            if ! python scripts/keep_going.py out/matches.json; then echo "No live or upcoming matches - stopping after $i fetches"; break; fi
            if [ $(( $(date +%s) - began )) -ge 20700 ]; then echo "Reached 5h45m - the next scheduled run takes over"; break; fi
            left=$(( 60 - ($(date +%s) - start) ))
            if [ "$left" -lt 7 ]; then left=7; fi  # stay under 10 calls a minute after a long full fetch
            sleep "$left"
          done
