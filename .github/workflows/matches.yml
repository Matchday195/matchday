name: Update matches

# Fetches real fixtures, scores and tables from football-data.org and saves them on the
# separate "data" branch, so frequent score updates never rebuild the website itself.
on:
  schedule:
    - cron: "*/10 * * * *"   # about every 10 minutes (GitHub may run it a little later)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_matches.py", ".github/workflows/matches.yml"]

permissions:
  contents: write

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  matches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Get previous data
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:standings.json > out/standings.json 2>/dev/null || rm -f out/standings.json
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/fetch_matches.py out
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update matches"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
